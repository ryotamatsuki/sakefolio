name: Sakefolio isolated security sandbox

on:
  push:
    branches: [test/sakefolio-security-sandbox-20261019]
    paths: ["web/**", ".github/workflows/sakefolio-security-sandbox.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sakefolio-preview
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 13a7a709dc8057e6e1142716e69c7906c0d14699
          path: public-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check public branch has not moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/${{ github.repository }}/git/ref/heads/test/sakefolio-pages-preview --jq .object.sha)" = "13a7a709dc8057e6e1142716e69c7906c0d14699"
      - name: Install sandbox dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Audit and regression checks
        working-directory: web
        run: |
          npm audit --audit-level=high
          npm run test:security
      - name: Build data-separated sandbox
        working-directory: web
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_SAKEFOLIO_SECURITY_TEST: "20261019"
        run: |
          test -n "$VITE_GOOGLE_CLIENT_ID"
          npm run build -- --base=/sakefolio/security-test-20261019/
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
      - name: Verify sandbox identity
        working-directory: web
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,readdirSync,writeFileSync} from 'node:fs';
          const bundle=readdirSync('dist/assets').filter(f=>f.endsWith('.js')).map(f=>readFileSync('dist/assets/'+f,'utf8')).join('');
          for(const marker of ['SAKEFOLIO_SECURITY_TEST_20261019','sakefolio-security-test-20261019-v1','sakefolio-security-test-20261019-international-local-v1']) {
            if(!bundle.includes(marker)) throw Error('Sandbox marker missing: '+marker);
          }
          writeFileSync('dist/security-sandbox-build.json',JSON.stringify({mode:'security-test-20261019',sourceCommit:process.env.GITHUB_SHA,securitySource:'adfad8199a1d24df7101180f300bc787229132d7',publicSource:'13a7a709dc8057e6e1142716e69c7906c0d14699',driveFolder:'SAKEFOLIO_SECURITY_TEST_20261019',localDatabase:'sakefolio-security-test-20261019-international-local-v1'}));
          JS
      - name: Rebuild existing public version unchanged
        working-directory: public-source/web
        env:
          GITHUB_PAGES: "true"
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Verify all public baseline files before deployment
        working-directory: public-source/web
        run: sha256sum --check ../../.github/sakefolio-public-baseline-13a7a709.sha256
      - name: Assemble public root and sandbox subdirectory
        run: |
          mkdir -p site/security-test-20261019
          cp -a public-source/web/dist/. site/
          cp -a web/dist/. site/security-test-20261019/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  codeql:
    name: Sandbox CodeQL security-extended gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: sakefolio-security-sandbox

  deploy:
    needs: [build, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: sakefolio-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
