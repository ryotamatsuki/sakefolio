name: Deploy Brother Beta to dedicated Cloudflare Pages
# Manual only. Installing this file does not publish an app.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Reviewed full 40-character commit SHA; no branch names'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: sakefolio-brother-beta-deploy
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate immutable source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: '[[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm audit --audit-level=high
        working-directory: web
      - run: npm run test:security && npm run test:html-audit && npm run test:deployment
        working-directory: web
      - name: Build with dedicated public OAuth configuration
        run: npm run build:beta
        working-directory: web
        env:
          VITE_BETA_ORIGIN: ${{ vars.BETA_ORIGIN }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.BETA_GOOGLE_CLIENT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: beta-deployment
          path: web/dist
          retention-days: 14
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: brother-beta-release
          output: codeql-results
      - run: node .github/scripts/check-codeql-sarif.mjs codeql-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta-release-codeql
          path: codeql-results/*.sarif
          if-no-files-found: error
  deploy:
    needs: [build, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # Owner must configure required reviewers for this environment before dispatch.
    environment:
      name: brother-beta
      url: ${{ vars.BETA_ORIGIN }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: beta-deployment
          path: web/dist
      - name: Upload reviewed static bundle to existing Pages project
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.156.2'
          command: pages deploy web/dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=brother-beta
      - name: Verify live HTTP headers, source SHA and exact JS/CSS bytes
        run: npm run verify:beta
        working-directory: web
