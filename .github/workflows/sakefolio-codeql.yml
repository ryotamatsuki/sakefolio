name: Sakefolio CodeQL security scan

on:
  push:
    branches: [main, feat/react-drive-sakefolio, security/sakefolio-audit-2026]
    paths:
      - 'web/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main, feat/appsheet-mvp-stage1]
    paths:
      - 'web/**'
      - '.github/workflows/**'
  schedule:
    - cron: '37 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          output: codeql-results
      - name: Reject current High or Critical CodeQL findings
        run: node .github/scripts/check-codeql-sarif.mjs codeql-results
      - name: Preserve CodeQL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sakefolio-codeql-sarif
          path: codeql-results/*.sarif
          if-no-files-found: error
          retention-days: 7
