name: Sakefolio React build

on:
  push:
    branches: [main, feat/react-drive-sakefolio]
    paths:
      - "web/**"
      - ".github/workflows/sakefolio-web.yml"
  pull_request:
    branches: [main, feat/appsheet-mvp-stage1]
    paths:
      - "web/**"
      - ".github/workflows/sakefolio-web.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          GITHUB_PAGES: "true"
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: web/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
