name: Sakefolio React build

on:
  push:
    branches: [main, feat/react-drive-sakefolio, security/sakefolio-audit-2026, feat/sakefolio-daily-use-2026]
    paths:
      - "web/**"
      - ".github/workflows/sakefolio-web.yml"
  pull_request:
    branches: [main, feat/appsheet-mvp-stage1]
    paths:
      - "web/**"
      - ".github/workflows/sakefolio-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sakefolio-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Reproducible dependency install (lockfile required)
        run: npm ci --no-audit --no-fund
        working-directory: web
      - name: Audit full production and development dependency tree
        run: npm audit --audit-level=high
        working-directory: web
      - name: Reject spoofed images and invalid records
        run: npm run test:security
        working-directory: web
      - name: Typecheck and production bundle
        run: npm run build
        working-directory: web
        env:
          GITHUB_PAGES: "true"
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
