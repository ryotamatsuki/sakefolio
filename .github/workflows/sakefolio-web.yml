name: Sakefolio React build

on:
  push:
    branches: [main, feat/react-drive-sakefolio]
    paths:
      - "web/**"
      - ".github/workflows/sakefolio-web.yml"
  pull_request:
    branches: [main, feat/appsheet-mvp-stage1]
    paths:
      - "web/**"
      - ".github/workflows/sakefolio-web.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-fund
        working-directory: web
      - name: Print generated lockfile for one-time archival
        run: |
          node -e "const b=require('fs').readFileSync('package-lock.json').toString('base64'); console.log('SAKE_LOCK_BEGIN'); for(let i=0;i<b.length;i+=4000)console.log('SAKE_LOCK_CHUNK='+b.slice(i,i+4000)); console.log('SAKE_LOCK_END');"
        working-directory: web
      - name: Test input and photo guards
        run: npm run test:security
        working-directory: web
      - name: Audit all dependencies
        run: npm audit --audit-level=high
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          GITHUB_PAGES: "true"
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: web/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
