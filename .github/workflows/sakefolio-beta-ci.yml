name: Brother Beta acceptance build
on:
  push:
    branches: ['release/brother-beta-*']
  pull_request:
    branches: [test/sakefolio-pages-preview, security/sakefolio-audit-2026]
permissions:
  contents: read
concurrency:
  group: brother-beta-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm audit --audit-level=high
        working-directory: web
      - run: npm run test:security && npm run test:html-audit && npm run test:deployment
        working-directory: web
      - name: Build root-path static bundle (not a deployment)
        run: npm run build
        working-directory: web
        env:
          GITHUB_PAGES: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: brother-beta-build-${{ github.sha }}
          path: web/dist
          retention-days: 14
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: brother-beta
          output: codeql-results
      - run: node .github/scripts/check-codeql-sarif.mjs codeql-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brother-beta-codeql-${{ github.sha }}
          path: codeql-results/*.sarif
          if-no-files-found: error
          retention-days: 14

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npx playwright install --with-deps chromium webkit
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          VITE_GOOGLE_CLIENT_ID: '123-synthetic.apps.googleusercontent.com'
      - run: npm run test:e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brother-beta-synthetic-browser-${{ github.sha }}
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14
